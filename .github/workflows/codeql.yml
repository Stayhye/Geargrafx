name: Build PS2 Libretro Core

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ps2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile PS2 Core
        uses: addnab/docker-run-action@v3
        with:
          image: ps2dev/ps2dev:latest
          options: -v ${{ github.workspace }}:/src -w /src
          run: |
            # Set up PS2 toolchain paths inside the container environment
            export PS2DEV=/usr/local/ps2dev
            export PS2SDK=$PS2DEV/ps2sdk
            export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2SDK/bin

            # Ensure make is available
            if ! command -v make &> /dev/null; then
              apk add --no-missing make build-base || apt-get update && apt-get install -y make build-essential
            fi

            cd platforms/libretro
            make -f Makefile.ps2

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geargrafx_libretro_ps2
          path: platforms/libretro/geargrafx_libretro_ps2.a
          if-no-files-found: error

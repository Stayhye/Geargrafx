name: Build PS2 Libretro Core

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ps2:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile PS2 Core
        run: |
          cd platforms/libretro
          make -f Makefile.ps2

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geargrafx_libretro_ps2
          path: platforms/libretro/geargrafx_libretro_ps2.a
          if-no-files-found: error
